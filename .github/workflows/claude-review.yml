name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude review."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for ZeroBox: a Node.js 20 Gmail cleanup CLI
            (Commander, Ink 4 + React 18 TUI, googleapis, bundled with esbuild)
            plus a Next.js 16 App Router landing site in site/ (React 19,
            TypeScript, Supabase waitlist). Focus on, in order:
            1. Correctness bugs and broken behaviour on phone and desktop.
            2. Error handling and input checks: Gmail API and OAuth errors, user
               input; on the site, accessibility (WCAG 2.2 AA).
            3. Gmail API rate limits and latency; on the site, client bundle
               size and layout shift.
            4. Missing or weak tests for the change.

            Use inline comments for specific issues. Post one short top-level
            summary. Do not comment on style that lint already enforces.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
